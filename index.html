<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Orbit Ripetizioni — Interrogazione Orale AI</title>
<meta name="description" content="Prototipo: interrogazione orale con AI per verificare la preparazione su un argomento." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="app">

  <header class="app-header">
    <div class="brand">
      <span class="brand-mark">O</span>
      <div class="brand-text">
        <h1>Orbit Ripetizioni</h1>
        <p>Interrogazione orale AI · prototipo</p>
      </div>
    </div>
  </header>

  <main class="app-main">

    <!-- SETUP -->
    <section id="setup-panel" class="panel">
      <h2>Prepara l'interrogazione</h2>
      <label class="field">
        <span>Argomento da studiare *</span>
        <input id="topic-input" type="text" placeholder="Es. La Rivoluzione Francese, le equazioni di secondo grado..." />
      </label>
      <label class="field">
        <span>Appunti o testo di riferimento (opzionale)</span>
        <textarea id="notes-input" rows="6" placeholder="Incolla qui appunti, riassunti o il testo del libro su cui l'AI dovrebbe basare le domande..."></textarea>
      </label>
      <button id="start-btn" class="btn btn-primary">Inizia interrogazione</button>
      <p id="setup-error" class="error-text" hidden></p>
    </section>

    <!-- INTERVIEW -->
    <section id="interview-panel" class="panel" hidden>
      <div class="interview-head">
        <h2 id="interview-topic">Argomento</h2>
        <span id="status-badge" class="status-badge">Pronto</span>
      </div>

      <div id="transcript" class="transcript" aria-live="polite"></div>

      <div class="controls">
        <button id="mic-btn" class="btn btn-mic" title="Parla">
          <span class="mic-icon" aria-hidden="true"></span>
          <span class="mic-label">Parla</span>
        </button>
        <form id="text-form" class="text-form">
          <input id="text-input" type="text" placeholder="Scrivi la tua risposta..." autocomplete="off" />
          <button type="submit" class="btn btn-secondary">Invia</button>
        </form>
      </div>
      <p id="speech-warning" class="warning-text" hidden>
        Il riconoscimento vocale non è supportato in questo browser: usa la tastiera qui sopra per rispondere.
      </p>
    </section>

    <!-- FINAL EVALUATION -->
    <section id="result-panel" class="panel" hidden>
      <h2>Valutazione finale</h2>
      <div class="score-card">
        <div class="score-number" id="score-number">-</div>
        <div class="score-label">/ 10</div>
      </div>
      <h3>Punti da ripassare</h3>
      <ul id="review-points"></ul>
      <button id="restart-btn" class="btn btn-primary">Nuova interrogazione</button>
    </section>

  </main>

  <footer class="app-footer">
    <p>Prototipo interno · Orbit Ripetizioni</p>
  </footer>
</div>

<script src="/js/app.js"></script>
</body>
</html>
